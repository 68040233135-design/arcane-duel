<!DOCTYPE html>
<html lang="th"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Arcane Duel – PvP</title>
<link href="https://fonts.googleapis.com/css2?family=Mitr:wght@400;600&family=Russo+One&family=Sarabun:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--tx:#f4efe6;--gold:#ffd23f;--ink:#0b0618;--red:#ff2e4d;--cy:#35e0ff;--pc:var(--gold);--disp:'Russo One','Mitr',sans-serif;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--ink);color:var(--tx);font-family:'Sarabun',system-ui,sans-serif;overflow:hidden}
body{background:radial-gradient(ellipse at 50% 100%,#ff2e4d33,transparent 55%),radial-gradient(ellipse at 50% 0%,#4a1d7a 0%,#1a1033 45%,#07040f 100%)}
body::before{content:'';position:fixed;inset:-60%;z-index:0;pointer-events:none;background:repeating-conic-gradient(from 0deg at 50% 45%,#ffffff0b 0 5deg,transparent 5deg 12deg);animation:spin 90s linear infinite}
body::after{content:'';position:fixed;inset:0;z-index:4;pointer-events:none;background:radial-gradient(ellipse at center,transparent 55%,#000b 100%)}
@keyframes spin{to{transform:rotate(360deg)}}
canvas{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:5}
#floor{position:fixed;left:0;right:0;bottom:0;height:46%;background:repeating-linear-gradient(90deg,transparent 0 59px,rgba(255,210,63,.1) 59px 60px),repeating-linear-gradient(0deg,transparent 0 39px,rgba(255,210,63,.07) 39px 40px),linear-gradient(transparent,rgba(255,60,90,.2));border-top:2px solid #ffd23f55;transform:perspective(400px) rotateX(35deg);transform-origin:bottom;opacity:.8}
#flash{position:fixed;inset:0;z-index:6;pointer-events:none;opacity:0}
#lines{position:fixed;inset:-25%;z-index:6;pointer-events:none;opacity:0;background:repeating-conic-gradient(at 50% 50%,transparent 0 3deg,var(--c,#fff) 3deg 3.7deg,transparent 3.7deg 9deg);-webkit-mask:radial-gradient(circle,transparent 22%,#000 70%);mask:radial-gradient(circle,transparent 22%,#000 70%)}
#stage{position:relative;height:100%;display:flex;flex-direction:column;max-width:960px;margin:0 auto;padding:10px}
h1,.who,#banner,.big{font-family:var(--disp);font-weight:400}

/* ---------- buttons ---------- */
button{font:inherit;font-family:var(--disp);font-size:15px;letter-spacing:.02em;cursor:pointer;border:0;border-radius:3px;padding:10px 20px;color:#1a1033;background:linear-gradient(#ffe9a8,#ffc13a 55%,#e8940a);transform:skewX(-10deg);box-shadow:0 4px 0 #8a5200,0 0 20px #ffb13344,inset 0 1px 0 #fff9;transition:transform .12s,filter .12s}
button:hover:not(:disabled){transform:skewX(-10deg) translateY(-2px);filter:brightness(1.12)}
button:active:not(:disabled){transform:skewX(-10deg) translateY(3px);box-shadow:0 1px 0 #8a5200}
button:focus-visible{outline:3px solid #fff;outline-offset:3px}
button:disabled{opacity:.35;cursor:not-allowed;filter:grayscale(.6)}
button small{display:block;font-family:'Sarabun';font-size:11px;opacity:.8}
#ba{background:linear-gradient(#ff9a8a,#ff2e4d 55%,#b0102c);color:#fff;box-shadow:0 4px 0 #6a0a1c,0 0 20px #ff2e4d55}
#bs{background:linear-gradient(#d9b8ff,#8f4dff 55%,#5a1fc4);color:#fff;box-shadow:0 4px 0 #34107a,0 0 20px #8f4dff55}
#bg{background:linear-gradient(#a8f0ff,#35a8ff 55%,#1262c4);color:#04121f;box-shadow:0 4px 0 #0a3a78,0 0 20px #35a8ff55}
#hm{position:fixed;left:10px;top:calc(10px + env(safe-area-inset-top,0px));z-index:9;padding:6px 12px}
#m1{font-size:22px;padding:14px 38px;animation:pb 1.2s ease-in-out infinite}
@keyframes pb{50%{transform:skewX(-10deg) scale(1.06)}}

/* ---------- menu ---------- */
#menu{position:fixed;inset:0;z-index:10;overflow:auto;padding:18px;text-align:center;background:rgba(7,4,15,.84);--pc:var(--gold)}
#menu[data-p="2"]{--pc:var(--cy)}
#menu::before{content:'';position:fixed;inset:-50%;z-index:-1;pointer-events:none;background:repeating-conic-gradient(at 50% 40%,#ffffff0d 0 4deg,transparent 4deg 10deg);animation:spin 120s linear infinite}
#menu h1{font-size:clamp(26px,6vw,42px);margin:6px 0 10px;color:var(--pc);transform:skewX(-8deg);text-shadow:3px 3px 0 #000,0 0 26px var(--pc)}
#menu h1.logo{margin:18px 0 6px;line-height:.95;font-size:clamp(46px,14vw,112px);text-shadow:none;animation:slam .7s cubic-bezier(.2,1.4,.4,1)}
.logo span{display:block;background:linear-gradient(#fff 0 38%,#ffd23f 39% 62%,#ff6a1a 63%);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-stroke:1.5px #2a0800;filter:drop-shadow(4px 4px 0 #ff2e4d) drop-shadow(0 0 22px #ff8a3c88)}
.logo span+span{background-image:linear-gradient(#fff 0 38%,#35e0ff 39% 62%,#3b6bff 63%);filter:drop-shadow(4px 4px 0 #7a1cff) drop-shadow(0 0 22px #35e0ff88)}
@keyframes slam{0%{opacity:0;transform:skewX(-8deg) scale(2.4)}100%{opacity:1;transform:skewX(-8deg) scale(1)}}
#menu p{margin:4px 0 14px;opacity:.8}
.ps1{font-family:var(--disp);letter-spacing:.3em;color:var(--gold);margin:12px 0 4px;text-shadow:0 0 12px var(--gold);animation:bl 1s steps(2) infinite}
@keyframes bl{50%{opacity:.25}}
.bt{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;margin:12px 0}
.lvb{max-width:460px;margin:10px auto;padding:12px 16px;border-radius:4px 18px 4px 18px;background:#ffffff12;border:1px solid #ffd23f55;border-left:5px solid var(--gold)}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(205px,1fr));gap:12px;max-width:1000px;margin:0 auto 16px;text-align:left}
.mc{position:relative;--c:#fff;padding:0 0 10px;border:2px solid #ffffff26;border-radius:4px 18px 4px 18px;cursor:pointer;overflow:hidden;background:linear-gradient(#ffffff12,#00000050);transition:transform .15s,border-color .15s,box-shadow .15s}
.mc:hover{transform:translateY(-4px);border-color:var(--c)}
.mc.on{border-color:var(--pc);background:color-mix(in srgb,var(--c) 24%,#0009);box-shadow:0 0 0 2px var(--pc),0 0 28px var(--c)}
.mc.on::after{content:'P1';position:absolute;top:8px;right:8px;padding:1px 12px;font-family:var(--disp);font-size:13px;color:#1a1033;background:var(--pc);transform:skewX(-12deg)}
#menu[data-p="2"] .mc.on::after{content:'P2'}
.mc .em{display:block;text-align:center;font-size:58px;line-height:1.2;padding:12px 0 8px;margin-bottom:8px;border-bottom:3px solid var(--c);background:radial-gradient(circle at 50% 65%,color-mix(in srgb,var(--c) 50%,transparent),transparent 70%),repeating-linear-gradient(115deg,#ffffff0a 0 6px,transparent 6px 12px);filter:drop-shadow(0 0 12px var(--c))}
.mc b,.mc small{padding:0 10px}
.mc b{font-family:var(--disp);font-weight:400;font-size:17px}
.mc small{display:block;font-size:12px;opacity:.85;margin-top:3px}
.mc .ps{color:#ffd98a;opacity:1;line-height:1.35}.mc .cr{color:#ff9e7a;opacity:1}

/* ---------- cover ---------- */
#menu.cover{background:radial-gradient(ellipse 80% 60% at 50% 0%,#4b3590 0%,transparent 70%),radial-gradient(ellipse 70% 50% at 50% 110%,#7a2a5a66,transparent 70%),linear-gradient(#1a1440,#0e0a24)}
#menu.cover::before{inset:-20%;background:radial-gradient(circle at 20% 30%,#ffb86a24,transparent 36%),radial-gradient(circle at 80% 70%,#5ae0ff22,transparent 40%);animation:drift 18s ease-in-out infinite alternate}
@keyframes drift{to{transform:translate(3%,-3%) scale(1.08)}}
.cv{position:relative;min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:12px 0;font-family:'Mitr','Sarabun',sans-serif}
.cv .st{position:absolute;width:3px;height:3px;border-radius:50%;background:#fff;pointer-events:none;animation:tw 4s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.12}50%{opacity:.8}}
#menu.cover h1.logo{margin:0;font-size:clamp(52px,15vw,112px);transform:skewX(-6deg);animation:rise .8s cubic-bezier(.2,1.2,.4,1) backwards,lf 5s 1s ease-in-out infinite}
@keyframes rise{0%{opacity:0;transform:translateY(24px) skewX(-6deg) scale(.92)}}
@keyframes lf{0%,100%{transform:skewX(-6deg)}50%{transform:translateY(-6px) skewX(-6deg)}}
.cover .logo span{-webkit-text-stroke:0;background-image:linear-gradient(#fff6dc,#ffd98a 60%,#ffab5e);filter:drop-shadow(0 4px 0 #0007) drop-shadow(0 0 24px #ffb86655)}
.cover .logo span+span{background-image:linear-gradient(#ecfcff,#8fe9ff 60%,#7aa2ff);filter:drop-shadow(0 4px 0 #0007) drop-shadow(0 0 24px #5ae0ff55)}
.cv .tag{font-size:clamp(14px,3.6vw,18px);color:#e6dcff;opacity:.9;letter-spacing:.04em;text-align:center}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:520px}
.chips span{padding:6px 14px;border-radius:99px;font-size:13px;color:#f3ecff;background:#ffffff14;border:1px solid #ffffff2a}
.hr{display:flex;gap:clamp(6px,2.5vw,18px);justify-content:center;margin:6px 0 0}
.hh{width:clamp(52px,14vw,76px);aspect-ratio:1;display:grid;place-items:center;font-size:clamp(30px,8vw,44px);border-radius:50%;cursor:pointer;background:radial-gradient(circle at 50% 40%,color-mix(in srgb,var(--c) 38%,transparent),#ffffff0a 75%);border:2px solid color-mix(in srgb,var(--c) 60%,#fff3);box-shadow:0 0 22px color-mix(in srgb,var(--c) 35%,transparent);animation:bob 3.2s ease-in-out infinite;transition:scale .15s}
.hh:nth-child(2n){animation-delay:-1s}.hh:nth-child(3n){animation-delay:-2s}
.hh:hover{scale:1.12}
.hh.pop{animation:pp .5s}
@keyframes pp{30%{transform:translateY(-22px) scale(1.2) rotate(-8deg)}60%{transform:translateY(0) scale(.95)}}
.cv .tip{min-height:50px;max-width:440px;font-size:14px;line-height:1.5;color:#ffe3a8;text-align:center}
#m3{background:linear-gradient(#a8f0ff,#35a8ff 55%,#1262c4);color:#04121f;box-shadow:0 4px 0 #0a3a78,0 0 20px #35a8ff55}
#m2{background:#ffffff1c;color:#f3ecff;box-shadow:inset 0 0 0 2px #ffffff40}
@media(prefers-reduced-motion:reduce){#menu.cover::before,.hh,.st,#m1,#menu.cover h1.logo{animation:none!important}}

/* ---------- draft ---------- */
.dtm{height:10px;max-width:520px;margin:6px auto;border-radius:9px;background:#ffffff1c;overflow:hidden}
.dtm i{display:block;height:100%;width:100%;background:linear-gradient(90deg,var(--pc),#fff8)}
.dtm.hot i{background:var(--red)}
#dsec{font-family:var(--disp);font-size:20px;color:var(--pc);min-height:28px}
.dts{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;margin:8px 0 12px}
.dts div{display:flex;align-items:center;gap:6px;padding:4px 12px;border-radius:99px;background:#ffffff12}
.dts b{font-family:var(--disp);font-weight:400;font-size:13px;margin-right:4px}
.dts span{display:inline-grid;place-items:center;width:36px;height:36px;border-radius:50%;background:#0006;border:1px solid #fff3;font-size:21px}
.mc.t1,.mc.t2{opacity:.3;pointer-events:none;filter:grayscale(.8)}
.mc.t1::after,.mc.t2::after{position:absolute;top:8px;right:8px;padding:1px 12px;font-family:var(--disp);font-size:13px;color:#1a1033;transform:skewX(-12deg)}
.mc.t1::after{content:'P1';background:var(--gold)}.mc.t2::after{content:'P2';background:var(--cy)}
#menu.aim .mc.t2::after{content:'AI'}
.mc .cf{display:none;width:calc(100% - 20px);margin:10px 10px 0;transform:skewX(-6deg)}
.mc.on .cf{display:block}
.ix{position:fixed;right:calc(12px + env(safe-area-inset-right,0px));top:calc(12px + env(safe-area-inset-top,0px));z-index:11;padding:8px 14px;font-size:14px;background:#ffffff1c;color:#f3ecff;box-shadow:inset 0 0 0 2px #ffffff40}
.flt{padding:6px 16px;font-size:14px;border-radius:99px;transform:none!important;background:#ffffff18;color:#f3ecff;box-shadow:inset 0 0 0 2px #ffffff33}
.flt.on{background:linear-gradient(#ffe9a8,#ffc13a);color:#1a1033;box-shadow:0 0 16px #ffc13a66}
#snd{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));right:12px;z-index:60;width:42px;height:42px;padding:0;font-size:20px;border-radius:50%;transform:none!important;background:#000a;color:#fff;box-shadow:inset 0 0 0 2px #ffffff55}
.ix{right:64px!important}
#end{justify-content:flex-start!important;overflow-y:auto;padding:4vh 10px 24px}
.sts{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;width:100%;max-width:980px;margin-top:18px}
.stt{flex:1 1 340px;max-width:480px;background:#ffffff0f;border:1px solid #ffffff22;border-radius:14px;padding:8px 10px;font-size:13px;text-align:left}
.sth{font-family:var(--disp);color:var(--tc);margin-bottom:4px;font-size:16px}
.str{display:grid;grid-template-columns:1.5fr 1fr 1fr 1fr;gap:6px;align-items:center;padding:3px 0;border-top:1px solid #ffffff14}
.str>i{font-style:normal;display:block;padding:2px 6px;border-radius:6px;font-size:12px;text-align:right;background:linear-gradient(90deg,color-mix(in srgb,var(--b,#fff) 38%,transparent) var(--p,0%),transparent var(--p,0%))}
/* ---------- battle HUD ---------- */
#top{text-align:center;min-height:54px}
#wv{display:flex;justify-content:center;align-items:center;gap:10px;font-family:var(--disp);font-size:13px}
#wv b{font-weight:400;padding:2px 14px;transform:skewX(-14deg)}
#wv .t1{background:linear-gradient(90deg,#ffd23f,#ff8a3c);color:#1a1033}
#wv .t2{background:linear-gradient(90deg,#35e0ff,#3b6bff);color:#04121f}
#wv i{font-style:normal;font-size:22px;color:var(--red);text-shadow:0 0 14px var(--red),2px 2px 0 #000}
#msg{display:inline-block;margin-top:4px;padding:3px 26px;font-family:var(--disp);font-size:clamp(15px,3.6vw,21px);color:var(--gold);text-shadow:0 2px 0 #000,0 0 12px #ffb13388;background:linear-gradient(90deg,transparent,#000b 20%,#000b 80%,transparent)}
#msg:empty{display:none}
.row{flex:1;display:flex;justify-content:center;align-items:center;gap:clamp(2px,1.2vw,28px)}
#foes{background:linear-gradient(90deg,transparent,#35e0ff12,transparent)}
#party{background:linear-gradient(90deg,transparent,#ffd23f12,transparent)}
#vs{position:relative;flex:none;height:2px;margin:4px 0;background:linear-gradient(90deg,transparent,var(--gold),var(--red),var(--cy),transparent);box-shadow:0 0 14px #ff8a3c88}
#vs::after{content:'VS';position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) skewX(-10deg);padding:0 14px;font-family:var(--disp);font-size:18px;color:#fff;background:var(--ink);border:2px solid var(--red);text-shadow:0 0 10px var(--red)}
.u{width:clamp(70px,22vw,140px);text-align:center;position:relative;--c:#fff}
.u .nm{display:inline-block;max-width:100%;padding:1px 10px;font-family:var(--disp);font-size:12px;transform:skewX(-12deg);background:linear-gradient(90deg,color-mix(in srgb,var(--c) 55%,#000),#000a);border-bottom:2px solid var(--c)}
.hero .nm{border-left:4px solid var(--gold)}.foe .nm{border-right:4px solid var(--cy)}
.u.active .nm{background:linear-gradient(90deg,var(--gold),#ff8a3c);color:#1a1033;animation:blk .7s infinite alternate}
@keyframes blk{to{filter:brightness(1.35)}}
.u .em{position:relative;isolation:isolate;font-size:clamp(40px,11.5vw,76px);line-height:1.1;filter:drop-shadow(0 0 16px var(--c));animation:bob 2.6s ease-in-out infinite}
.u .em::after{content:'';position:absolute;left:50%;bottom:2px;width:95%;height:16px;transform:translateX(-50%);z-index:-1;border-radius:50%;background:radial-gradient(ellipse,var(--c),transparent 70%);opacity:.7}
.u:nth-child(2) .em{animation-delay:-.9s}.u:nth-child(3) .em{animation-delay:-1.7s}.u:nth-child(4) .em{animation-delay:-.4s}
@keyframes bob{50%{transform:translateY(-8px)}}
.foe .em{transform:scaleX(-1);animation-name:bobf}
@keyframes bobf{0%,100%{transform:scaleX(-1) translateY(0)}50%{transform:scaleX(-1) translateY(-8px)}}
.bar{position:relative;height:12px;margin-top:4px;background:#000c;border:2px solid #fff;transform:skewX(-20deg);overflow:hidden;box-shadow:0 0 0 1px #000}
.bar i{position:relative;z-index:1;display:block;height:100%;width:100%;transition:width .12s}
.bar::after{content:'';position:absolute;inset:0;z-index:2;background:repeating-linear-gradient(90deg,transparent 0 9px,#0007 9px 10px)}
.hp::before{content:'';position:absolute;inset:0 auto 0 0;width:var(--w,100%);background:#ffd23f;transition:width .9s .35s}
.hp i{background:linear-gradient(#ff8a6b,#e8384f 55%,#a0102a)}
.mp i{background:linear-gradient(#9fe6ff,#3b6bff)}
.bar.mp{height:7px;border-width:1px}
.u.low .hp i{animation:lw .5s infinite alternate}
@keyframes lw{to{filter:brightness(2.2)}}
.num{font-family:var(--disp);font-size:11px;margin-top:2px;text-shadow:0 1px 0 #000}
.pn{font-size:11px;color:#ffd98a;line-height:1.2}.sb{font-size:12px;min-height:16px}
.u.active::before{content:'';position:absolute;left:50%;top:-6px;width:80%;height:70%;transform:translateX(-50%);background:radial-gradient(circle,var(--c),transparent 68%);opacity:.5;z-index:-1;animation:pul 1s infinite}
@keyframes pul{50%{opacity:.15}}
.u.tgt{cursor:pointer;animation:tg .6s infinite alternate}
@keyframes tg{to{transform:scale(1.1)}}
.u.tgt .em{filter:drop-shadow(0 0 6px #fff) drop-shadow(0 0 22px var(--red))}
.u.tgt::after{content:'🎯';position:absolute;top:-14px;right:4px;font-size:22px;filter:drop-shadow(0 0 8px var(--red))}
.u.hit .em{animation:hit .35s}
@keyframes hit{25%{filter:brightness(4) drop-shadow(0 0 20px #fff);transform:translateX(-10px)}60%{transform:translateX(8px)}}
.foe.hit .em{animation-name:hitf}
@keyframes hitf{25%{filter:brightness(4);transform:scaleX(-1) translateX(-10px)}60%{transform:scaleX(-1) translateX(8px)}}
.u.dead{opacity:.18;filter:grayscale(1);transition:1s}.u.dead .em{animation:none}
.u.dead.foe{opacity:0;transform:scale(.4) rotate(20deg);pointer-events:none}
.f{position:fixed;z-index:7;font-family:var(--disp);font-style:italic;-webkit-text-stroke:2px #000;paint-order:stroke fill;pointer-events:none;text-shadow:0 3px 0 #000,0 0 16px currentColor;animation:fl 1.1s ease-out forwards}
@keyframes fl{0%{transform:translate(-50%,0) scale(.4);opacity:0}15%{transform:translate(-50%,-14px) scale(1.4);opacity:1}100%{transform:translate(-50%,-80px) scale(1);opacity:0}}

/* ---------- command panel ---------- */
#cmd{position:relative;z-index:8;min-height:76px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:center;padding:12px 28px 14px;border:0;border-top:3px solid #ffffff33;background:linear-gradient(#1b1030ee,#0b0618f5);clip-path:polygon(14px 0,100% 0,calc(100% - 14px) 100%,0 100%);transition:border-color .3s}
.who{color:var(--gold);width:100%;text-align:center;font-size:15px;text-shadow:0 2px 0 #000}
.pi{width:100%;text-align:center;font-size:12.5px;color:#ffd98a}

/* ---------- banners & cut-in ---------- */
#banner{position:fixed;left:0;right:0;top:34%;text-align:center;line-height:1.1;letter-spacing:.04em;font-size:clamp(48px,15vw,120px);z-index:9;pointer-events:none;opacity:0;background:linear-gradient(#fff 0 38%,#ffd23f 39% 62%,#ff4a1a 63%);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-stroke:2px #2a0800;filter:drop-shadow(5px 5px 0 #ff2e4d) drop-shadow(0 0 30px #ff8a3c)}
#banner.go{animation:bn 1.5s ease-out}
@keyframes bn{0%{opacity:0;transform:skewX(-8deg) scale(3.2)}18%{opacity:1;transform:skewX(-8deg) scale(.94)}28%{transform:skewX(-8deg) scale(1.05)}36%{transform:skewX(-8deg) scale(1)}78%{opacity:1;transform:skewX(-8deg) scale(1)}100%{opacity:0;transform:skewX(-8deg) scale(1.15);letter-spacing:.2em}}
#cut{position:fixed;left:0;right:0;top:30%;height:110px;z-index:9;pointer-events:none;display:none;align-items:center;gap:16px;padding:0 6vw;border-top:3px solid var(--c);border-bottom:3px solid var(--c);background:linear-gradient(90deg,transparent,color-mix(in srgb,var(--c) 65%,#000) 15%,#000d 85%,transparent);box-shadow:0 0 40px var(--c)}
#cut.go{display:flex;animation:ct 1s ease-out forwards}
#cut.rt{flex-direction:row-reverse;animation-name:ctr}
#cut span{font-size:70px;filter:drop-shadow(0 0 16px var(--c))}
#cut b{font-family:var(--disp);font-weight:400;font-style:italic;font-size:clamp(26px,8vw,54px);color:#fff;-webkit-text-stroke:1.5px #000;text-shadow:4px 4px 0 var(--c)}
@keyframes ct{0%{opacity:0;transform:skewY(-3deg) translateX(-60%)}15%{opacity:1;transform:skewY(-3deg) translateX(0)}80%{opacity:1;transform:skewY(-3deg) translateX(3%)}100%{opacity:0;transform:skewY(-3deg) translateX(40%)}}

q('.sb').textContent=[u.ward>0?'🛡'+u.ward:'',u.burn>0?'🔥'+u.burn:'',u.frz>0?'❄️':'',u.shield>0?'✨':'',u.guard?'🔰':'',u.st>0?'⚡'+u.st:'',u.ncrit?'🎯':'',u.bt>0?'⚔️↑'+u.bt:'',u.vt>0?'💢'+u.vt:'',u.dt>0?'⬇'+u.dt:'',u.tt>0?'📣'+u.tt:'',u.cv>0?'🏰'+u.cv:''].filter(Boolean).join(' ');u.el.classList.toggle('dead',u.hp<=0)}
function begin(){M.style.display='none';$('#end').style.display='none';over=false;$('#cmd').innerHTML='';msg('');$('#party').innerHTML='';$('#foes').innerHTML='';
party.forEach(u=>$('#party').append(u.el));foes.forEach(u=>$('#foes').append(u.el));$('#wv').innerHTML='<b class=t1>P1 '+'★'.repeat(W[0])+'</b><i>VS</i><b class=t2>'+'★'.repeat(W[1])+' '+(MODE=='ai'?'AI':'P2')+'</b>';
const id=++BID;AU.music(null);AU.sfx('round');banner('ROUND '+(++RN)).then(()=>{AU.sfx('fight');AU.music('battle');return banner('FIGHT!')}).then(()=>battle(id))}
const chk=()=>!party.some(p=>p.hp>0)?(finish(0),1):!foes.some(f=>f.hp>0)?(finish(1),1):0;
async function battle(id){while(!over&&id==BID){const order=alive([...party,...foes]).sort((a,b)=>b.spd-a.spd);
for(const u of order){if(u.hp<=0||over||id!=BID)continue;u.guard=0;u.hb=0;if(u.shield>0)u.shield--;['bt','vt','dt','tt','cv'].forEach(k=>{if(u[k]>0)u[k]--});
if(u.burn>0){u.burn--;u.hb=1;msg(u.n+' ถูกไฟเผา 🔥');hit(u,{d:Math.max(1,Math.round(u.max*.06)),crit:0,src:null,nd:1,raw:1},'#ff7a3c');await sleep(700);if(chk())return;if(u.hp<=0)continue}
if(u.frz>0){u.frz--;upd(u);msg(u.n+' แข็งติดอยู่ ❄️');await sleep(800);continue}
if(u.pid=='regen'&&u.hp<u.max)heal(u,Math.round(u.max*.05));if(u.pid=='bless'){const a=alive(ally(u)).sort((x,y)=>x.hp/x.max-y.hp/y.max)[0];if(a&&a.hp<a.max){heal(a,Math.round(a.max*.08),u);await sleep(500)}}
u.el.classList.add('active');await playerTurn(u);u.el.classList.remove('active');if(id!=BID)return;if(chk())return}}}
function playerTurn(u){if(MODE=='ai'&&u.side=='f')return aiTurn(u);return new Promise(res=>{const cmd=$('#cmd');cmd.style.borderColor=u.side=='p'?'#ffc857':'#6fd6ff';
const fin=async f=>{cmd.innerHTML='';clearTgt();await f();res()};
const menu=()=>{clearTgt();cmd.innerHTML=`<div class=who>ผู้เล่น ${u.side=='p'?1:2} · ${u.e} ตาของ ${u.n}</div><div class=pi>💠 ${u.pn}: ${u.pd}</div><button id=ba>⚔️ โจมตี</button><button id=bs ${u.mp<u.cost?'disabled':''}>✨ ${u.sk}<small>${u.cost} MP</small></button><button id=bg>🛡️ ป้องกัน</button>`;
$('#ba').onclick=()=>ask(t=>fin(()=>attack(u,t)));
$('#bs').onclick=()=>u.k=='empower'?ask(t=>fin(()=>skill(u,t)),1):['single','drain','twin','pierce','vuln'].includes(u.k)?ask(t=>fin(()=>skill(u,t))):fin(()=>skill(u));
$('#bg').onclick=()=>fin(async()=>{u.guard=1;u.mp=Math.min(u.mpMax,u.mp+5);upd(u);msg(u.n+' ตั้งท่าป้องกัน');fx(u.el,'#8fd0ff',26,'burst');await sleep(700)})};
const ask=(cb,al)=>{cmd.innerHTML='<div class=who>แตะเลือกเป้าหมาย</div><button id=bc>↩ ย้อนกลับ</button>';$('#bc').onclick=menu;const O=alive(opp(u)),T=O.filter(x=>x.tt>0),L=al?alive(ally(u)):T.length?T:O;L.forEach(t=>t.el.classList.add('tgt'));tgtCb=t=>{if(L.includes(t)){clearTgt();cb(t)}}};
msg('');menu()})}
function clearTgt(){tgtCb=null;document.querySelectorAll('.tgt').forEach(e=>e.classList.remove('tgt'))}
// ---------- damage & passives
function calc(u,t,m,pierce,bonus=0){const crit=!!u.ncrit||Math.random()<crOf(u)+bonus+(u.pid=='weak'&&(t.burn>0||t.frz>0||t.vt>0)?.25:0)||(t.frz>0&&has(u,'chill'));if(u.ncrit){u.ncrit=0;upd(u)}
const d=atkOf(u)*m*(.9+Math.random()*.2)*(crit?u.cd+(has(u,'tactician')?.2:0):1)-(pierce?0:defOf(t)*.6);return{d:Math.max(1,Math.round(d)),crit,src:u}}
function hit(t,r,col){const u=r.src;
if(t.pid=='dodge'&&!r.nd&&Math.random()<.25){AU.sfx('dodge');t.ncrit=1;upd(t);float(t.el,'หลบ! 🎯','#c9a8ff',30);fx(t.el,'#b388ff',18,'burst');return 0}
let d=r.d;if(!r.raw){if(t.guard)d*=.5;if(t.shield>0)d*=.6;if(t.pid=='scale')d*=.85;if(t.vt>0&&!r.rf)d*=1.3}d=Math.max(1,Math.round(d));
if(t.pid=='bulwark')d=Math.min(d,Math.round(t.max*.2));
if(!r.cv&&!r.rf&&!r.raw){const c=alive(ally(t)).find(x=>x.cv>0&&x!==t);if(c){const sh=Math.round(d*.5);d-=sh;float(c.el,'🏰รับแทน','#9bd4ff',18);hit(c,{d:sh,crit:0,src:null,nd:1,cv:1},col)}}
if(t.ward>0){const a=Math.min(t.ward,d);t.ward-=a;d-=a;float(t.el,'🛡-'+a,'#9bd4ff',24)}
const dd=Math.min(d,t.hp);t.sT+=dd;if(u&&u!==t)u.sD+=dd;t.hp=Math.max(0,t.hp-d);
if(d>0)float(t.el,r.crit?'💥'+d+'!':d,r.crit?'#ffd23f':'#fff',r.crit?46:30);
AU.imp(u?u.snd:r.raw?'fire':'punch',r.crit);fx(t.el,col,r.crit?50:24,'burst');if(r.crit){fx(t.el,'#ffd23f',1,'ring');flash('#ffd23f')}
t.el.classList.remove('hit');void t.el.offsetWidth;t.el.classList.add('hit');shake(r.crit?12:6);
if(u&&u!==t&&!r.rf){
 if(r.crit){if(u.pid=='eagle'){u.mp=Math.min(u.mpMax,u.mp+4)}if(u.pid=='charge'&&u.st<5){u.st++;float(u.el,'⚡ATK +'+u.st*8+'%','#fff04d',20)}}
 if(u.pid=='burn'&&t.hp>0){t.burn=2;AU.sfx('burn');float(t.el,'🔥ติดไฟ','#ff7a3c',24)}
 if(u.pid=='chill'&&t.hp>0&&Math.random()<.4){t.frz=1;AU.sfx('ice');float(t.el,'❄️แข็ง','#9be7ff',28)}
 if(u.pid=='lifesteal'&&d>0&&u.hp>0)heal(u,Math.max(1,Math.round(d*(r.crit?.5:.3))));
 upd(u)}
if(t.pid=='thorn'&&!r.rf&&d>0&&u&&u.hp>0&&u!==t){float(t.el,'สะท้อน!','#ffb347',20);hit(u,{d:Math.max(1,Math.round(d*.25)),crit:0,src:t,rf:1,nd:1,raw:1},'#ffb347')}
if(t.hp<=0){if(t.pid=='fox'&&!t.used){t.used=1;t.hp=Math.round(t.max*.3);t.burn=0;AU.sfx('revive');float(t.el,'🦊 คืนชีพ!','#ff9ecb',28);fx(t.el,'#ff9ecb',70,'burst');fx(t.el,'#ff9ecb',1,'ring')}
 else{AU.sfx('ko');t.burn=0;t.frz=0;fx(t.el,col,70,'burst');float(t.el,'ล้ม!','#ff7a7a',26)}}
upd(t);return d}
// ---------- combat
function heal(t,a,src){const bn=t.burn>0||t.hb;if(bn)a=Math.max(1,Math.round(a*.5));a=Math.min(a,t.max-t.hp);t.hp+=a;(src||t).sH+=a;if(a>0)AU.sfx('heal');upd(t);if(bn&&a>0)float(t.el,'🔥ฮีล-50%','#ff9e7a',15);float(t.el,'+'+a,'#7dff8a',30);fx(t.el,'#7dff8a',24,'up')}
function lunge(u){return u.el.animate([{transform:'none'},{transform:`translateY(${u.side=='p'?-60:60}px) scale(1.18)`,offset:.4},{transform:'none'}],{duration:480,easing:'ease-out'}).finished}
async function attack(u,t){msg(`${u.n} โจมตี ${t.n}`);AU.cast(u,0);await lunge(u);fx(t.el,u.c,30,'slash');await sleep(120);hit(t,calc(u,t,1),u.c);
u.mp=Math.min(u.mpMax,u.mp+4);upd(u);await sleep(650)}
async function skill(u,t){u.mp-=u.cost;upd(u);msg(`${u.n} ใช้ ${u.sk}!`);if(HROLE.atk.includes(u.k))AU.cast(u,1);cutin(u);await lunge(u);flash(u.c);
const A=opp(u).filter(x=>x.hp>0);
switch(u.k){
case'single':case'pierce':fx(t.el,u.c,60,'slash');fx(t.el,u.c,1,'ring');await sleep(250);hit(t,calc(u,t,u.m,u.k=='pierce'),u.c);break;
case'twin':for(let i=0;i<2;i++){if(t.hp<=0)break;fx(t.el,u.c,34,'slash');await sleep(200);hit(t,calc(u,t,u.m,0,.15),u.c);await sleep(150)}break;
case'aoe':case'freeze':A.forEach(x=>{fx(x.el,u.c,50,'burst');fx(x.el,u.c,1,'ring');hit(x,calc(u,x,u.m),u.c);if(u.k=='freeze'&&x.hp>0&&Math.random()<.4){x.frz=1;AU.sfx('ice');float(x.el,'❄️','#9be7ff',34)}});break;
case'multi':for(let i=0;i<u.h;i++){const x=rnd(opp(u).filter(f=>f.hp>0));if(!x)break;fx(x.el,u.c,40,'slash');await sleep(160);hit(x,calc(u,x,u.m),u.c);await sleep(120)}break;
case'drain':fx(t.el,u.c,50,'slash');await sleep(250);{const d=hit(t,calc(u,t,u.m),u.c);heal(u,Math.round(d*.7))}break;
case'heal':ally(u).filter(x=>x.hp>0).forEach(x=>{heal(x,Math.round((u.atk*u.m*1.8+10)*HPX),u);fx(x.el,u.c,1,'ring')});break;
case'atkbuff':AU.sfx('buff');ally(u).filter(x=>x.hp>0).forEach(x=>{x.bm=1.3;x.bt=3;upd(x);float(x.el,'⚔️ATK+30%','#ffd36b',22);fx(x.el,u.c,26,'up');fx(x.el,u.c,1,'ring')});break;
case'empower':AU.sfx('buff');t.bm=1.5;t.bt=3;t.ncrit=1;upd(t);float(t.el,'⚔️ATK+50% 🎯','#ffd36b',22);fx(t.el,u.c,40,'up');fx(t.el,u.c,1,'ring');break;
case'vuln':fx(t.el,u.c,40,'burst');fx(t.el,u.c,1,'ring');await sleep(200);hit(t,calc(u,t,u.m),u.c);if(t.hp>0){t.vt=3;upd(t);float(t.el,'💢เปราะบาง +30%','#ff9e7a',22)}break;
case'taunt':AU.sfx('roar');u.tt=2;upd(u);float(u.el,'📣ยั่วยุ!','#ffb347',26);fx(u.el,u.c,40,'burst');fx(u.el,u.c,1,'ring');break;
case'roar':AU.sfx('roar');u.tt=1;upd(u);opp(u).filter(x=>x.hp>0).forEach(x=>{x.dt=3;upd(x);float(x.el,'⬇ATK-25%','#ff9e7a',22);fx(x.el,u.c,30,'burst')});fx(u.el,u.c,1,'ring');break;
case'cover':AU.sfx('buff');u.cv=3;upd(u);float(u.el,'🏰คุ้มกัน','#9bd4ff',26);fx(u.el,u.c,1,'ring');fx(u.el,u.c,30,'up');break;
case'shield':AU.sfx('buff');ally(u).filter(x=>x.hp>0).forEach(x=>{x.shield=3;float(x.el,'🛡️','#ffe27a',34);fx(x.el,u.c,1,'ring');fx(x.el,u.c,20,'up')});break}
await sleep(750)}
async function enemyTurn(u){const A=party.filter(p=>p.hp>0);let t=rnd(A);if(Math.random()<.4)t=A.reduce((a,b)=>a.hp<b.hp?a:b);
if(u.sp&&Math.random()<.4){const s=rnd(u.sp);msg(`${u.n} ปล่อยสกิลพิเศษ!`);await lunge(u);flash(u.c);
if(s=='aoe')A.forEach(x=>{fx(x.el,u.c,50,'burst');fx(x.el,u.c,1,'ring');hit(x,calc(u,x,.8),u.c)});
else if(s=='heavy'){fx(t.el,u.c,60,'slash');await sleep(250);hit(t,calc(u,t,2),u.c)}
else{fx(t.el,u.c,50,'slash');await sleep(250);const d=hit(t,calc(u,t,1.3),u.c);heal(u,Math.round(d*.8))}
await sleep(750)}else{await attack(u,t)}}
// ---------- effects
const cv=$('#cv'),cx=cv.getContext('2d');let P=[],R=[],S=[];
function rs(){cv.width=innerWidth;cv.height=innerHeight}rs();addEventListener('resize',rs);
for(let i=0;i<70;i++)S.push({x:Math.random(),y:Math.random(),r:Math.random()*1.6+.3,p:Math.random()*6});
function ctr(el){const r=el.getBoundingClientRect();return{x:r.left+r.width/2,y:r.top+r.height*.4}}
function fx(el,col,n,type){const{x,y}=ctr(el);
if(type=='ring'){R.push({x,y,r:10,col,l:1});return}
for(let i=0;i<n;i++){let a=Math.random()*6.283,s=2+Math.random()*7,vx=Math.cos(a)*s,vy=Math.sin(a)*s;
if(type=='slash'){const k=(Math.random()-.5)*2;vx=k*11;vy=k*11+(Math.random()-.5)*2}
if(type=='up'){vx=(Math.random()-.5)*2;vy=-1-Math.random()*3}
P.push({x,y,vx,vy,l:1,d:.018+Math.random()*.025,s:1+Math.random()*3,col})}}
function float(el,t,col,sz){const{x,y}=ctr(el),d=document.createElement('div');d.className='f';d.textContent=t;d.style.cssText=`left:${x+(Math.random()*30-15)}px;top:${y-20}px;color:${col};font-size:${sz}px`;document.body.append(d);setTimeout(()=>d.remove(),1150)}
function shake(px){const s=$('#stage');s.classList.remove('shake');void s.offsetWidth;s.classList.add('shake')}
function flash(col){const f=$('#flash');f.style.background=`radial-gradient(circle,${col}66,transparent 70%)`;f.animate([{opacity:.9},{opacity:0}],{duration:500});const l=$('#lines');l.style.setProperty('--c',col);l.animate([{opacity:.8,transform:'scale(1.25)'},{opacity:0,transform:'scale(1)'}],{duration:500})}
function cutin(u){const c=$('#cut');c.style.setProperty('--c',u.c);c.innerHTML=`<span>${u.e}</span><b>${u.sk}</b>`;c.className='';void c.offsetWidth;c.className='go '+(u.side=='p'?'':'rt')}
function loop(t){cx.clearRect(0,0,cv.width,cv.height);cx.globalCompositeOperation='lighter';
S.forEach(s=>{cx.globalAlpha=.3+.5*Math.abs(Math.sin(t/900+s.p));cx.fillStyle='#fff';cx.beginPath();cx.arc(s.x*cv.width,s.y*cv.height*.75,s.r,0,6.283);cx.fill()});
P=P.filter(p=>p.l>0);P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vx*=.95;p.vy*=.95;p.l-=p.d;cx.globalAlpha=Math.max(0,p.l);cx.strokeStyle=p.col;cx.lineWidth=p.s;cx.shadowColor=p.col;cx.shadowBlur=10;cx.beginPath();cx.moveTo(p.x,p.y);cx.lineTo(p.x-p.vx*2,p.y-p.vy*2);cx.stroke()});
R=R.filter(r=>r.l>0);R.forEach(r=>{r.r+=6;r.l-=.035;cx.globalAlpha=Math.max(0,r.l);cx.strokeStyle=r.col;cx.lineWidth=4;cx.shadowBlur=18;cx.shadowColor=r.col;cx.beginPath();cx.arc(r.x,r.y,r.r,0,6.283);cx.stroke()});
cx.shadowBlur=0;requestAnimationFrame(loop)}requestAnimationFrame(loop);
function end(t,sub,btns,extra){over=true;const e=$('#end');e.innerHTML=`<div class=big>${t}</div><div style="line-height:1.7">${sub}</div><div class=bt></div>${extra||''}`;
btns.forEach(([l,f])=>{const b=document.createElement('button');b.textContent=l;b.onclick=f;e.querySelector('.bt').append(b)});e.style.display='flex';
for(let i=0;i<14;i++)setTimeout(()=>{for(let j=0;j<40;j++){const a=Math.random()*6.283,v=2+Math.random()*8;P.push({x:Math.random()*cv.width,y:Math.random()*cv.height*.6,vx:Math.cos(a)*v,vy:Math.sin(a)*v,l:1,d:.015,s:3,col:rnd(['#ffc857','#ff5a3c','#7dff8a','#9be7ff','#ff9ecb'])})}},i*220)}
function statsHTML(){const all=[...party,...foes],mx=k=>Math.max(1,...all.map(u=>u[k])),cols=[['sD','⚔️ ดาเมจ','#ffb347'],['sT','🩸 รับดาเมจ','#ff7a7a'],['sH','💚 ฮีล','#7dff8a']],mvp=all.reduce((a,b)=>b.sD>a.sD?b:a);
const tb=(arr,nm,c)=>`<div class=stt style="--tc:${c}"><div class=sth>${nm}</div><div class=str><span></span>${cols.map(a=>`<i>${a[1]}</i>`).join('')}</div>${arr.map(u=>`<div class=str><span>${u.e} ${u.n}${u===mvp?' 👑':''}${u.hp<=0?' 💀':''}</span>${cols.map(([k,,b])=>`<i style="--p:${Math.round(u[k]/mx(k)*100)}%;--b:${b}"><b>${u[k]}</b></i>`).join('')}</div>`).join('')}</div>`;
return `<div class=sts>${tb(party,'ทีม P1','#ffc857')}${tb(foes,MODE=='ai'?'ทีม AI':'ทีม P2','#6fd6ff')}</div>`}
async function finish(w){over=true;const id=BID;w?W[0]++:W[1]++;AU.music(null);await sleep(500);AU.sfx('finish');await banner('K.O.!');if(id!=BID)return;AU.sfx(MODE=='ai'&&!w?'lose':'win');end(w?'🏆 ผู้เล่น 1 ชนะ!':MODE=='ai'?'💀 AI ชนะ!':'🏆 ผู้เล่น 2 ชนะ!',`ชัยชนะ P1 ${W[0]} : ${W[1]} ${MODE=='ai'?'AI':'P2'}`,[['สู้อีกยก (ทีมเดิม)',()=>pvpStart(...PV)],['เลือกทีมใหม่',pvp],['เมนู',home]],statsHTML())}
