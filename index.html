<!DOCTYPE html>
<html lang="th"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Arcane Duel – PvP</title>
<link href="https://fonts.googleapis.com/css2?family=Mitr:wght@400;600&family=Russo+One&family=Sarabun:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--tx:#f4efe6;--gold:#ffd23f;--ink:#0b0618;--red:#ff2e4d;--cy:#35e0ff;--pc:var(--gold);--disp:'Russo One','Mitr',sans-serif;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--ink);color:var(--tx);font-family:'Sarabun',system-ui,sans-serif;overflow:hidden}
body{background:radial-gradient(ellipse at 50% 100%,#ff2e4d33,transparent 55%),radial-gradient(ellipse at 50% 0%,#4a1d7a 0%,#1a1033 45%,#07040f 100%)}
body::before{content:'';position:fixed;inset:-60%;z-index:0;pointer-events:none;background:repeating-conic-gradient(from 0deg at 50% 45%,#ffffff0b 0 5deg,transparent 5deg 12deg);animation:spin 90s linear infinite}
body::after{content:'';position:fixed;inset:0;z-index:4;pointer-events:none;background:radial-gradient(ellipse at center,transparent 55%,#000b 100%)}
@keyframes spin{to{transform:rotate(360deg)}}
canvas{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:5}
#floor{position:fixed;left:0;right:0;bottom:0;height:46%;background:repeating-linear-gradient(90deg,transparent 0 59px,rgba(255,210,63,.1) 59px 60px),repeating-linear-gradient(0deg,transparent 0 39px,rgba(255,210,63,.07) 39px 40px),linear-gradient(transparent,rgba(255,60,90,.2));border-top:2px solid #ffd23f55;transform:perspective(400px) rotateX(35deg);transform-origin:bottom;opacity:.8}
#flash{position:fixed;inset:0;z-index:6;pointer-events:none;opacity:0}
#lines{position:fixed;inset:-25%;z-index:6;pointer-events:none;opacity:0;background:repeating-conic-gradient(at 50% 50%,transparent 0 3deg,var(--c,#fff) 3deg 3.7deg,transparent 3.7deg 9deg);-webkit-mask:radial-gradient(circle,transparent 22%,#000 70%);mask:radial-gradient(circle,transparent 22%,#000 70%)}
#stage{position:relative;height:100%;display:flex;flex-direction:column;max-width:960px;margin:0 auto;padding:10px}
h1,.who,#banner,.big{font-family:var(--disp);font-weight:400}

/* ---------- buttons ---------- */
button{font:inherit;font-family:var(--disp);font-size:15px;letter-spacing:.02em;cursor:pointer;border:0;border-radius:3px;padding:10px 20px;color:#1a1033;background:linear-gradient(#ffe9a8,#ffc13a 55%,#e8940a);transform:skewX(-10deg);box-shadow:0 4px 0 #8a5200,0 0 20px #ffb13344,inset 0 1px 0 #fff9;transition:transform .12s,filter .12s}
button:hover:not(:disabled){transform:skewX(-10deg) translateY(-2px);filter:brightness(1.12)}
button:active:not(:disabled){transform:skewX(-10deg) translateY(3px);box-shadow:0 1px 0 #8a5200}
button:focus-visible{outline:3px solid #fff;outline-offset:3px}
button:disabled{opacity:.35;cursor:not-allowed;filter:grayscale(.6)}
button small{display:block;font-family:'Sarabun';font-size:11px;opacity:.8}
#ba{background:linear-gradient(#ff9a8a,#ff2e4d 55%,#b0102c);color:#fff;box-shadow:0 4px 0 #6a0a1c,0 0 20px #ff2e4d55}
#bs{background:linear-gradient(#d9b8ff,#8f4dff 55%,#5a1fc4);color:#fff;box-shadow:0 4px 0 #34107a,0 0 20px #8f4dff55}
#bg{background:linear-gradient(#a8f0ff,#35a8ff 55%,#1262c4);color:#04121f;box-shadow:0 4px 0 #0a3a78,0 0 20px #35a8ff55}
#hm{position:fixed;left:10px;top:calc(10px + env(safe-area-inset-top,0px));z-index:9;padding:6px 12px}
#m1{font-size:22px;padding:14px 38px;animation:pb 1.2s ease-in-out infinite}
@keyframes pb{50%{transform:skewX(-10deg) scale(1.06)}}

/* ---------- menu ---------- */
#menu{position:fixed;inset:0;z-index:10;overflow:auto;padding:18px;text-align:center;background:rgba(7,4,15,.84);--pc:var(--gold)}
#menu[data-p="2"]{--pc:var(--cy)}
#menu::before{content:'';position:fixed;inset:-50%;z-index:-1;pointer-events:none;background:repeating-conic-gradient(at 50% 40%,#ffffff0d 0 4deg,transparent 4deg 10deg);animation:spin 120s linear infinite}
#menu h1{font-size:clamp(26px,6vw,42px);margin:6px 0 10px;color:var(--pc);transform:skewX(-8deg);text-shadow:3px 3px 0 #000,0 0 26px var(--pc)}
#menu h1.logo{margin:18px 0 6px;line-height:.95;font-size:clamp(46px,14vw,112px);text-shadow:none;animation:slam .7s cubic-bezier(.2,1.4,.4,1)}
.logo span{display:block;background:linear-gradient(#fff 0 38%,#ffd23f 39% 62%,#ff6a1a 63%);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-stroke:1.5px #2a0800;filter:drop-shadow(4px 4px 0 #ff2e4d) drop-shadow(0 0 22px #ff8a3c88)}
.logo span+span{background-image:linear-gradient(#fff 0 38%,#35e0ff 39% 62%,#3b6bff 63%);filter:drop-shadow(4px 4px 0 #7a1cff) drop-shadow(0 0 22px #35e0ff88)}
@keyframes slam{0%{opacity:0;transform:skewX(-8deg) scale(2.4)}100%{opacity:1;transform:skewX(-8deg) scale(1)}}
#menu p{margin:4px 0 14px;opacity:.8}
.ps1{font-family:var(--disp);letter-spacing:.3em;color:var(--gold);margin:12px 0 4px;text-shadow:0 0 12px var(--gold);animation:bl 1s steps(2) infinite}
@keyframes bl{50%{opacity:.25}}
.bt{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;margin:12px 0}
.lvb{max-width:460px;margin:10px auto;padding:12px 16px;border-radius:4px 18px 4px 18px;background:#ffffff12;border:1px solid #ffd23f55;border-left:5px solid var(--gold)}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(205px,1fr));gap:12px;max-width:1000px;margin:0 auto 16px;text-align:left}
.mc{position:relative;--c:#fff;padding:0 0 10px;border:2px solid #ffffff26;border-radius:4px 18px 4px 18px;cursor:pointer;overflow:hidden;background:linear-gradient(#ffffff12,#00000050);transition:transform .15s,border-color .15s,box-shadow .15s}
.mc:hover{transform:translateY(-4px);border-color:var(--c)}
.mc.on{border-color:var(--pc);background:color-mix(in srgb,var(--c) 24%,#0009);box-shadow:0 0 0 2px var(--pc),0 0 28px var(--c)}
.mc.on::after{content:'P1';position:absolute;top:8px;right:8px;padding:1px 12px;font-family:var(--disp);font-size:13px;color:#1a1033;background:var(--pc);transform:skewX(-12deg)}
#menu[data-p="2"] .mc.on::after{content:'P2'}
.mc .em{display:block;text-align:center;font-size:58px;line-height:1.2;padding:12px 0 8px;margin-bottom:8px;border-bottom:3px solid var(--c);background:radial-gradient(circle at 50% 65%,color-mix(in srgb,var(--c) 50%,transparent),transparent 70%),repeating-linear-gradient(115deg,#ffffff0a 0 6px,transparent 6px 12px);filter:drop-shadow(0 0 12px var(--c))}
.mc b,.mc small{padding:0 10px}
.mc b{font-family:var(--disp);font-weight:400;font-size:17px}
.mc small{display:block;font-size:12px;opacity:.85;margin-top:3px}
.mc .ps{color:#ffd98a;opacity:1;line-height:1.35}.mc .cr{color:#ff9e7a;opacity:1}

/* ---------- cover ---------- */
#menu.cover{background:radial-gradient(ellipse 80% 60% at 50% 0%,#4b3590 0%,transparent 70%),radial-gradient(ellipse 70% 50% at 50% 110%,#7a2a5a66,transparent 70%),linear-gradient(#1a1440,#0e0a24)}
#menu.cover::before{inset:-20%;background:radial-gradient(circle at 20% 30%,#ffb86a24,transparent 36%),radial-gradient(circle at 80% 70%,#5ae0ff22,transparent 40%);animation:drift 18s ease-in-out infinite alternate}
@keyframes drift{to{transform:translate(3%,-3%) scale(1.08)}}
.cv{position:relative;min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:12px 0;font-family:'Mitr','Sarabun',sans-serif}
.cv .st{position:absolute;width:3px;height:3px;border-radius:50%;background:#fff;pointer-events:none;animation:tw 4s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.12}50%{opacity:.8}}
#menu.cover h1.logo{margin:0;font-size:clamp(52px,15vw,112px);transform:skewX(-6deg);animation:rise .8s cubic-bezier(.2,1.2,.4,1) backwards,lf 5s 1s ease-in-out infinite}
@keyframes rise{0%{opacity:0;transform:translateY(24px) skewX(-6deg) scale(.92)}}
@keyframes lf{0%,100%{transform:skewX(-6deg)}50%{transform:translateY(-6px) skewX(-6deg)}}
.cover .logo span{-webkit-text-stroke:0;background-image:linear-gradient(#fff6dc,#ffd98a 60%,#ffab5e);filter:drop-shadow(0 4px 0 #0007) drop-shadow(0 0 24px #ffb86655)}
.cover .logo span+span{background-image:linear-gradient(#ecfcff,#8fe9ff 60%,#7aa2ff);filter:drop-shadow(0 4px 0 #0007) drop-shadow(0 0 24px #5ae0ff55)}
.cv .tag{font-size:clamp(14px,3.6vw,18px);color:#e6dcff;opacity:.9;letter-spacing:.04em;text-align:center}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:520px}
.chips span{padding:6px 14px;border-radius:99px;font-size:13px;color:#f3ecff;background:#ffffff14;border:1px solid #ffffff2a}
.hr{display:flex;gap:clamp(6px,2.5vw,18px);justify-content:center;margin:6px 0 0}
.hh{width:clamp(52px,14vw,76px);aspect-ratio:1;display:grid;place-items:center;font-size:clamp(30px,8vw,44px);border-radius:50%;cursor:pointer;background:radial-gradient(circle at 50% 40%,color-mix(in srgb,var(--c) 38%,transparent),#ffffff0a 75%);border:2px solid color-mix(in srgb,var(--c) 60%,#fff3);box-shadow:0 0 22px color-mix(in srgb,var(--c) 35%,transparent);animation:bob 3.2s ease-in-out infinite;transition:scale .15s}
.hh:nth-child(2n){animation-delay:-1s}.hh:nth-child(3n){animation-delay:-2s}
.hh:hover{scale:1.12}
.hh.pop{animation:pp .5s}
@keyframes pp{30%{transform:translateY(-22px) scale(1.2) rotate(-8deg)}60%{transform:translateY(0) scale(.95)}}
.cv .tip{min-height:50px;max-width:440px;font-size:14px;line-height:1.5;color:#ffe3a8;text-align:center}
#m3{background:linear-gradient(#a8f0ff,#35a8ff 55%,#1262c4);color:#04121f;box-shadow:0 4px 0 #0a3a78,0 0 20px #35a8ff55}
#m2{background:#ffffff1c;color:#f3ecff;box-shadow:inset 0 0 0 2px #ffffff40}
@media(prefers-reduced-motion:reduce){#menu.cover::before,.hh,.st,#m1,#menu.cover h1.logo{animation:none!important}}

/* ---------- draft ---------- */
.dtm{height:10px;max-width:520px;margin:6px auto;border-radius:9px;background:#ffffff1c;overflow:hidden}
.dtm i{display:block;height:100%;width:100%;background:linear-gradient(90deg,var(--pc),#fff8)}
.dtm.hot i{background:var(--red)}
#dsec{font-family:var(--disp);font-size:20px;color:var(--pc);min-height:28px}
.dts{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;margin:8px 0 12px}
.dts div{display:flex;align-items:center;gap:6px;padding:4px 12px;border-radius:99px;background:#ffffff12}
.dts b{font-family:var(--disp);font-weight:400;font-size:13px;margin-right:4px}
.dts span{display:inline-grid;place-items:center;width:36px;height:36px;border-radius:50%;background:#0006;border:1px solid #fff3;font-size:21px}
.mc.t1,.mc.t2{opacity:.3;pointer-events:none;filter:grayscale(.8)}
.mc.t1::after,.mc.t2::after{position:absolute;top:8px;right:8px;padding:1px 12px;font-family:var(--disp);font-size:13px;color:#1a1033;transform:skewX(-12deg)}
.mc.t1::after{content:'P1';background:var(--gold)}.mc.t2::after{content:'P2';background:var(--cy)}
#menu.aim .mc.t2::after{content:'AI'}
.mc .cf{display:none;width:calc(100% - 20px);margin:10px 10px 0;transform:skewX(-6deg)}
.mc.on .cf{display:block}
.ix{position:fixed;right:calc(12px + env(safe-area-inset-right,0px));top:calc(12px + env(safe-area-inset-top,0px));z-index:11;padding:8px 14px;font-size:14px;background:#ffffff1c;color:#f3ecff;box-shadow:inset 0 0 0 2px #ffffff40}
.flt{padding:6px 16px;font-size:14px;border-radius:99px;transform:none!important;background:#ffffff18;color:#f3ecff;box-shadow:inset 0 0 0 2px #ffffff33}
.flt.on{background:linear-gradient(#ffe9a8,#ffc13a);color:#1a1033;box-shadow:0 0 16px #ffc13a66}
#snd{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));right:12px;z-index:60;width:42px;height:42px;padding:0;font-size:20px;border-radius:50%;transform:none!important;background:#000a;color:#fff;box-shadow:inset 0 0 0 2px #ffffff55}
.ix{right:64px!important}
#end{justify-content:flex-start!important;overflow-y:auto;padding:4vh 10px 24px}
.sts{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;width:100%;max-width:980px;margin-top:18px}
.stt{flex:1 1 340px;max-width:480px;background:#ffffff0f;border:1px solid #ffffff22;border-radius:14px;padding:8px 10px;font-size:13px;text-align:left}
.sth{font-family:var(--disp);color:var(--tc);margin-bottom:4px;font-size:16px}
.str{display:grid;grid-template-columns:1.5fr 1fr 1fr 1fr;gap:6px;align-items:center;padding:3px 0;border-top:1px solid #ffffff14}
.str>i{font-style:normal;display:block;padding:2px 6px;border-radius:6px;font-size:12px;text-align:right;background:linear-gradient(90deg,color-mix(in srgb,var(--b,#fff) 38%,transparent) var(--p,0%),transparent var(--p,0%))}
.ah{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;padding:6px 52px 6px 0;font-size:14px;font-family:'Mitr','Sarabun',sans-serif}
.xb{width:110px;height:8px;border-radius:9px;background:#ffffff22;overflow:hidden}.xb i{display:block;height:100%;background:linear-gradient(90deg,#7dff8a,#ffe27a)}
.tg{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:760px;margin:8px auto}
.tl{width:96px;padding:8px 4px;border-radius:14px;text-align:center;background:#ffffff10;border:2px solid color-mix(in srgb,var(--c,#888) 55%,#fff2);cursor:pointer;font-size:12px;line-height:1.35}
.tl.no{filter:grayscale(1) brightness(.55);cursor:default}.tl.on{box-shadow:0 0 14px var(--c)}.em2{font-size:34px;line-height:1.2}
.sg{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;max-width:420px;margin:10px auto}
.stb{padding:10px 0;font-size:18px}.stb small{display:block;font-size:10px;opacity:.75}.stb.ok{box-shadow:0 0 0 2px #7dff8a99}
.stb.bs{background:linear-gradient(#ff9e7a,#d8452a);color:#fff}
.sp{max-width:420px;margin:8px auto;padding:10px 14px;border-radius:14px;background:#ffffff10;font-size:14px;line-height:1.7;font-family:'Mitr','Sarabun',sans-serif}
.tip2{padding:6px 14px;border-radius:99px;background:#7dff8a22;border:1px solid #7dff8a66;color:#d6ffd9;font-size:14px}
#m4{background:linear-gradient(#b9ff9e,#4cd964 55%,#1f9a3a);color:#06210d;box-shadow:0 4px 0 #0f5a22,0 0 20px #4cd96455}
/* ---------- adventure UI v2 ---------- */
#adv{position:fixed;inset:0;z-index:20;display:none;flex-direction:column;color:#fff;font-family:'Mitr','Sarabun',sans-serif;background:radial-gradient(ellipse 80% 50% at 15% 0%,#43308f66,transparent 60%),radial-gradient(ellipse 70% 50% at 100% 100%,#0d6e8f55,transparent 60%),linear-gradient(#171040,#080819);overflow:hidden;-webkit-tap-highlight-color:transparent}
#adv::before{content:'';position:absolute;inset:-20%;background:radial-gradient(circle at 25% 35%,#ffb86a1c,transparent 30%),radial-gradient(circle at 75% 65%,#5ae0ff1a,transparent 32%);animation:drift 20s ease-in-out infinite alternate;pointer-events:none}
#adv *{box-sizing:border-box}:where(#adv) button{all:unset;box-sizing:border-box;cursor:pointer;font-family:inherit}
.a-top{position:relative;z-index:2;display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top,0px)) 60px 10px 12px;background:linear-gradient(#0b0826dd,#0b082600)}
.a-bk{width:38px;height:38px;border-radius:12px;background:#ffffff18;border:1px solid #ffffff2a;display:grid;place-items:center;font-size:22px;flex:none}
.a-pf{display:flex;align-items:center;gap:8px;flex:1;min-width:0}
.a-ring{width:46px;height:46px;border-radius:50%;background:conic-gradient(#ffd23f var(--p),#ffffff24 0);display:grid;place-items:center;flex:none}
.a-ring b{width:36px;height:36px;border-radius:50%;background:#1a1440;display:grid;place-items:center;font-size:16px}
.a-pn{font-size:14px;line-height:1.2}.a-xt{font-size:11px;opacity:.7}
.a-rs{display:flex;gap:6px;flex:none}.a-rc{padding:4px 10px;border-radius:99px;background:#ffffff14;border:1px solid #ffffff26;font-size:13px;white-space:nowrap}
#am{position:relative;z-index:1;flex:1;overflow-y:auto;padding:6px 14px calc(100px + env(safe-area-inset-bottom,0px))}
#am>*{max-width:720px;margin-left:auto;margin-right:auto}
.a-nav{position:absolute;z-index:3;left:0;right:0;bottom:0;display:flex;justify-content:center;gap:6px;padding:14px 10px calc(8px + env(safe-area-inset-bottom,0px));background:linear-gradient(#0b082600,#0b0826f2 40%)}
.a-nav button{flex:1;max-width:120px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0;border-radius:16px;font-size:12px;opacity:.65;transition:.2s}
.a-nav i{font-style:normal;font-size:24px}
.a-nav button.on{opacity:1;background:linear-gradient(#ffffff26,#ffffff0d);box-shadow:inset 0 0 0 1px #ffffff40,0 0 18px #ffc13a33;transform:translateY(-4px)}
.a-h{display:flex;justify-content:space-between;align-items:baseline;margin:14px 2px 8px;font-size:16px}.a-h small{opacity:.7;font-size:12px}
.a-bn{display:flex;align-items:center;justify-content:center;gap:6px;padding:11px 18px;border-radius:14px;font-size:16px;font-weight:600;color:#2a1700;background:linear-gradient(#ffeaa5,#ffc13a);box-shadow:0 4px 0 #a86a00,0 8px 18px #0006;transition:transform .08s}
.a-bn:active{transform:translateY(3px);box-shadow:0 1px 0 #a86a00}
.a-bn.g{background:linear-gradient(#b9ff9e,#4cd964);box-shadow:0 4px 0 #1b7a30,0 8px 18px #0006;color:#06210d}
.a-bn.b{background:linear-gradient(#b4ecff,#38a8ff);box-shadow:0 4px 0 #0e5aa0,0 8px 18px #0006;color:#04162b}
.a-bn.x{background:#ffffff1c;color:#ffffff88;box-shadow:none;cursor:default}.a-bn.big{width:100%;padding:14px;font-size:19px}
.a-pnl{margin:12px auto 0;padding:12px 14px;border-radius:18px;background:linear-gradient(#ffffff16,#ffffff08);border:1px solid #ffffff22;backdrop-filter:blur(6px)}
.a-note{margin-top:14px;font-size:12px;opacity:.65;text-align:center;line-height:1.6}
.a-lg{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin:6px 0 0;font-size:11px}.a-lg span{padding:2px 8px;border-radius:99px;background:#ffffff12;border:1px solid var(--k)}
.a-gr{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:10px}.a-tm{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.a-sl{aspect-ratio:3/4;border-radius:16px;border:2px dashed #ffffff33;display:grid;place-items:center;text-align:center;font-size:11px;opacity:.75;background:#ffffff08;line-height:1.4}
.a-hc{position:relative;aspect-ratio:3/4;border-radius:16px;padding:3px;cursor:pointer;background:linear-gradient(160deg,var(--fc),color-mix(in srgb,var(--fc) 30%,#000));box-shadow:0 6px 14px #0008,0 0 16px color-mix(in srgb,var(--fc) 40%,transparent);overflow:hidden;transition:transform .15s}
.a-hc:active{transform:scale(.96)}.a-hc.in{outline:2px solid #fff8;outline-offset:1px}
.a-hc>i{position:relative;display:flex;align-items:center;justify-content:center;height:100%;border-radius:13px;font-style:normal;background:radial-gradient(circle at 50% 40%,color-mix(in srgb,var(--c) 50%,#1a1440),#0b0824 78%)}
.a-hc .ar{font-size:clamp(38px,10vw,56px);filter:drop-shadow(0 0 10px var(--c));margin-top:-8px}
.a-hc .lv{position:absolute;left:5px;top:5px;font-size:10px;padding:0 6px;border-radius:8px;background:#000b;border:1px solid var(--fc)}
.a-hc .sr{position:absolute;left:0;right:0;bottom:19px;text-align:center;font-size:9px;color:#ffe27a;letter-spacing:-1px}
.a-hc .nx{position:absolute;left:0;right:0;bottom:0;padding:2px 2px 3px;text-align:center;font-size:10px;background:linear-gradient(#0000,#000c);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.a-hc .rb{position:absolute;right:-24px;top:9px;transform:rotate(40deg);background:linear-gradient(#ffe27a,#ff9a3a);color:#3a1c00;font-size:9px;font-weight:700;padding:1px 26px}
.a-hc.gold::after,.a-hc.red::after{content:'';position:absolute;inset:0;background:linear-gradient(110deg,transparent 40%,#ffffff55 50%,transparent 60%);transform:translateX(-120%);animation:shn 3s infinite;pointer-events:none}
@keyframes shn{60%,100%{transform:translateX(120%)}}
.a-hc.red{animation:rgl 2s ease-in-out infinite}@keyframes rgl{50%{box-shadow:0 6px 14px #0008,0 0 28px #ff4a4a}}
.a-hc.no{filter:grayscale(1) brightness(.45);cursor:default}
.a-cht{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 8px}

#top{text-align:center;min-height:54px}

function lvUp(all){const h=G.heroes[AH],o=frK(h.lv);let n=0;while(h.lv<hCap()&&G.bread>=lvCost(h.lv)){G.bread-=lvCost(h.lv);h.lv++;n++;if(!all)break}
if(!n)return toast(h.lv>=50?'เลเวลสูงสุดแล้ว!':h.lv>=hCap()?`ติดเพดาน Lv.${hCap()} — เพิ่มเลเวลผู้เล่นเพื่อปลดล็อก`:'ขนมปังไม่พอ — ไปลงด่านเพื่อหา 🍞');
sv();AU.sfx('buff');hudUp();rHero();$('.a-art').classList.add('lvup');toast(frK(h.lv)!=o?`✨ กรอบเลื่อนระดับ! Lv.${h.lv}`:`⬆️ LEVEL UP! Lv.${h.lv}`)}
function openPick(i,s){const h=G.heroes[i],cur=h.eq[s],S=$('#a-sw'),list=G.inv.filter(x=>x.sl==s&&(s!='sig'||x.h==i)).sort((a,b)=>'ryb'.indexOf(a.t)-'ryb'.indexOf(b.t));
S.classList.remove('open');S.innerHTML=`<div class=a-bd></div><div class=a-sh><div class=a-sht>${SLE[s]} ${SLP[s]} · ${H[i].n}</div>${list.map(it=>{const o=Object.keys(G.heroes).find(k=>G.heroes[k].eq[s]==it.id);return`<button class=a-it style="--k:${TIER[it.t].c};display:flex;width:100%" data-id=${it.id}><i>${SLE[s]}</i><div><b style="color:${TIER[it.t].c}">${iNm(it)}</b> <small>[${TIER[it.t].n}]</small><br><small>${iTxt(it)}${o!=null?' · ใส่อยู่: '+H[o].e:''}</small></div></button>`}).join('')||'<div class=a-note>ยังไม่มีไอเทมช่องนี้<br>'+(s=='sig'?'ไปท้า 👹 บอสประจำตัวที่แท็บบอสได้เลย!':'ไปสู้บอสด่าน 5 และ 10 ได้เลย!')+'</div>'}${cur?'<button class="a-bn x" id=un style="margin-top:6px;width:100%;color:#fff">ถอดออก</button>':''}</div>`;
void S.offsetWidth;S.classList.add('open');S.querySelector('.a-bd').onclick=closeSh;
S.querySelectorAll('[data-id]').forEach(e=>e.onclick=()=>{const id=+e.dataset.id;for(const k in G.heroes)if(G.heroes[k].eq[s]==id)delete G.heroes[k].eq[s];h.eq[s]=id;sv();closeSh();rHero();toast('ใส่ไอเทมแล้ว')});
if(cur)$('#un').onclick=()=>{delete h.eq[s];sv();closeSh();rHero()}}
function rBag(){const its=[...G.inv].sort((a,b)=>'ryb'.indexOf(a.t)-'ryb'.indexOf(b.t));
$('#am').innerHTML=`<div class=a-h><b>🎒 ไอเทมทั้งหมด</b><small>${its.length} ชิ้น</small></div>${its.map(it=>{const o=Object.keys(G.heroes).find(k=>G.heroes[k].eq[it.sl]==it.id);return`<div class=a-it style="--k:${TIER[it.t].c}"><i>${SLE[it.sl]}</i><div><b style="color:${TIER[it.t].c}">${iNm(it)}</b> <small>[${TIER[it.t].n}]</small><br><small>${iTxt(it)}</small></div>${o!=null?`<span>${H[o].e}</span>`:''}</div>`}).join('')||'<div class=a-note>ยังไม่มีไอเทม<br>บอสด่าน 5 และ 10 มีโอกาสดรอป!</div>'}`}
function pull(){const i=rnd([...H.keys()]),h=G.heroes[i];if(h){if(h.s<5){h.s++;return{i,k:'star'}}G.gems+=50;return{i,k:'max'}}G.heroes[i]={s:1,lv:1,eq:{}};return{i,k:'new'}}
const revH=r=>`<div class="a-rv ${r.k}">${hcH(r.i,{tag:r.k=='new'?'NEW!':r.k=='star'?'★UP':'MAX'})}</div>`;
function sumBtns(){const all=PEND.length&&PEND.every(x=>x.o),B=$('#a-btns');if(!B)return;
B.innerHTML=!PEND.length?`<button class="a-bn" id=p1 ${G.gems<100?'style="opacity:.5"':''}>สุ่ม ×1<small>💎 100</small></button><button class="a-bn g" id=p10 ${G.gems<900?'style="opacity:.5"':''}>สุ่ม ×10<small>💎 900</small></button>`:all?`<button class="a-bn" id=pd>เสร็จสิ้น</button>`:`<button class="a-bn b" id=oa>เปิดทั้งหมด</button>`;
if(!PEND.length){$('#p1').onclick=()=>doPull(1);$('#p10').onclick=()=>doPull(10)}else if(all){$('#pd').onclick=()=>{PEND=[];rSummon()};const nw=PEND.filter(x=>x.k=='new').length,su=PEND.filter(x=>x.k=='star').length;$('#a-sm').textContent=`ได้ฮีโร่ใหม่ ${nw} ตัว · เพิ่มดาว ${su} ครั้ง`}else $('#oa').onclick=()=>PEND.forEach((r,k)=>setTimeout(()=>openBox(k,1),k*220))}
function rSummon(){$('#am').innerHTML=`<div class=a-sum><div class=a-rays></div><h2>🎁 สุ่มฮีโร่</h2><div class=a-sub>สะสมแล้ว ${Object.keys(G.heroes).length}/${H.length} · ซ้ำ = เพิ่มดาว (สูงสุด ★5)</div><div class="a-bxs n${PEND.length>1?10:1}" id=a-bxs>${PEND.length?PEND.map((r,k)=>r.o?revH(r):`<div class=a-bx data-k=${k}><span>🎁</span></div>`).join(''):'<div class=a-bx id=a-idle><span>🎁</span></div>'}</div><div id=a-sm class=a-sub>${PEND.length?'แตะกล่องเพื่อเปิด!':'กดสุ่มแล้วแตะกล่องเพื่อเปิด'}</div><div class=a-btns id=a-btns></div></div>`;
advEl().querySelectorAll('.a-bx[data-k]').forEach(e=>e.onclick=()=>openBox(+e.dataset.k));sumBtns()}
function doPull(n){const c=n==10?900:100;if(G.gems<c)return toast('💎 ไม่พอ — ลงด่านเพื่อหาเจม');G.gems-=c;PEND=Array.from({length:n},()=>({...pull(),o:0}));sv();hudUp();AU.sfx('fight');rSummon()}
function sparks(el){const V=advEl(),b=el.getBoundingClientRect(),r=V.getBoundingClientRect();for(let k=0;k<16;k++){const a=Math.random()*6.283,v=50+Math.random()*80,e=document.createElement('s');e.className='a-sp';e.style.cssText=`left:${b.left-r.left+b.width/2}px;top:${b.top-r.top+b.height/2}px;--dx:${Math.cos(a)*v}px;--dy:${Math.sin(a)*v}px;--c:${rnd(['#ffd23f','#ff8ad8','#7dff8a','#9be7ff','#fff'])}`;V.append(e);setTimeout(()=>e.remove(),900)}}
function openBox(k,fast){const r=PEND[k];if(!r||r.o||r.b)return;const el=advEl().querySelector(`.a-bx[data-k="${k}"]`);if(!el){r.o=1;return}r.b=1;el.classList.add('shk');AU.sfx('roar');
setTimeout(()=>{if(!el.isConnected){r.o=1;return}sparks(el);el.outerHTML=revH(r);r.o=1;AU.sfx(r.k=='new'?'revive':'pick');if(r.k=='new')AU.sfx('win');sumBtns()},fast?260:800)}

// ---------- hero signature boss mode
const HBF=50,HBL=10,hasSig=i=>G.inv.some(q=>q.sl=='sig'&&q.h==i),hbRate=i=>Math.min(1,.15+.12*(G.pity[i]||0)),hbE=i=>1+.04*G.heroes[i].lv;
function rBoss(){const own=Object.keys(G.heroes).map(Number).sort((a,b)=>G.heroes[b].lv-G.heroes[a].lv||a-b);
$('#am').innerHTML=`<div class=a-h><b>👹 บอสประจำตัวฮีโร่</b><small>ได้ตราแล้ว ${own.filter(hasSig).length}/${own.length}</small></div><div class=a-pnl style="margin-top:0;font-size:13px;line-height:1.7">ท้า <b>เงาของฮีโร่</b> เพื่อชิง 🌟 ไอเทมประจำตัว<br>☠️ ความยาก: สูง · 🍞 ค่าเข้า ${HBF} (คืนเมื่อชนะ) · ฮีโร่ต้อง Lv.${HBL}+<br>🎲 ดรอปเริ่ม 15% · +12% ทุกครั้งที่ชนะแต่ไม่ดรอป · การันตีชัยชนะที่ 8</div>${own.map(i=>{const d=H[i],h=G.heroes[i],ok=hasSig(i),lk=h.lv<HBL;return`<button class="a-bc${lk?' lk':''}${ok?' dn':''}" style="--c:${d.c}" data-b=${i}><i class=ar>${d.e}</i><div><b>เงา${d.n}</b> <small>Lv.${h.lv}</small><br><small>${ok?'✔ ได้ตราประจำตัวแล้ว':lk?'🔒 ต้องฮีโร่ Lv.'+HBL:'🎲 ดรอป '+Math.round(hbRate(i)*100)+'%'}</small></div><span class=a-go>${ok?'ได้แล้ว':'ท้า ›'}</span></button>`}).join('')}`;
advEl().querySelectorAll('[data-b]').forEach(e=>e.onclick=()=>openBoss(+e.dataset.b))}
function openBoss(i){const d=H[i],h=G.heroes[i],S=$('#a-sw'),ok=hasSig(i),lk=h.lv<HBL,pt=G.pity[i]||0,e=hbE(i),xp=40+h.lv;
S.classList.remove('open');S.innerHTML=`<div class=a-bd></div><div class=a-sh><div class=a-sht>👹 เงา${d.n} · บอสประจำตัว</div><div class=a-en><div class=a-eb style="--c:${d.c}">${d.e}<small>บอส</small></div></div><div class=a-ch><span>☠️ ความยาก: สูง</span><span>⚔️ พลังบอส ×${e.toFixed(2)} (HP ×2.2)</span><span>👥 ลูกสมุนเพิ่ม</span></div><div class=a-ch><span>🍞 เข้า ${HBF}</span><span>💎 ~${30+h.lv}</span><span>⭐ EXP ~${xp}</span></div><div class=a-dr>${ok?'✔ ฮีโร่ตัวนี้มีไอเทมประจำตัวแล้ว':`🌟 โอกาสดรอปไอเทมประจำตัว <b>${pt>=7?100:Math.round(hbRate(i)*100)}%</b><br>${pt>=7?'การันตีรอบนี้!':'ชนะแต่ไม่ดรอป โอกาสเพิ่มขึ้นเรื่อย ๆ (การันตีอีก '+(7-pt)+' ครั้ง)'}<br>ระดับตรา: แดง 20% · เหลือง 40% · น้ำเงิน 40%`}</div><div class=a-tm style="grid-template-columns:repeat(${G.team.length},minmax(0,78px));justify-content:center;margin:12px 0">${G.team.map(k=>hcH(k)).join('')}</div><button class="a-bn r big${ok||lk?' x':''}" id=go>${ok?'✔ ได้ไอเทมแล้ว':lk?'🔒 ต้อง Lv.'+HBL:'⚔️ ท้าเงา'+d.n}</button></div>`;
void S.offsetWidth;S.classList.add('open');S.querySelector('.a-bd').onclick=closeSh;$('#go').onclick=()=>ok||lk?0:hbStart(i)}
function hbStart(i){ld();const h=G.heroes[i];if(!h||h.lv<HBL)return;if(G.bread<HBF)return toast('🍞 ขนมปังไม่พอ — ไปลงด่านเพื่อหา');
G.bread-=HBF;sv();advHide();const e=hbE(i),cnt=Math.max(2,G.team.length);ADV={n:0,c:0,s:'BOSS',boss:1,hb:i};MODE='adv';DIFF='hard';RN=0;
party=G.team.map(k=>{const u=mk(k,'p');scaleU(u,pM(k));return u});
const ids=[i,...[...H.keys()].filter(x=>x!=i).sort(()=>Math.random()-.5).slice(0,cnt-1)];
foes=ids.map((x,k)=>{const u=mk(x,'f');scaleU(u,!k?{h:e*2.2,a:e*1.3,d:Math.pow(e,.8)*1.15,s:2,c:.1}:{h:e*.8,a:e*.8,d:Math.pow(e,.8)*.8,s:0,c:0});if(!k)u.el.querySelector('.nm').textContent='👹 เงา'+u.n;return u});begin()}
function hbEnd(w){const i=ADV.hb,lv=G.heroes[i].lv,L0=lvOf(G.xp).l,pt=G.pity[i]||0,own=hasSig(i),dr=[];let gem=0,br=0,xp=w?40+lv:8,got=0;
if(w){gem=30+lv;br=HBF+40+2*lv;if(!own){if(pt>=7||Math.random()<hbRate(i)){const r=Math.random();dr.push(mkItem(r<.2?'r':r<.6?'y':'b','sig',Math.min(5,1+(lv/10|0)),i));G.pity[i]=0;got=1}else G.pity[i]=pt+1}}
G.gems+=gem;G.bread+=br;G.xp+=xp;G.inv.push(...dr);const L1=lvOf(G.xp).l;sv();
const ln=[w?`💎 +${gem}`:'เงาแข็งแกร่งมาก! อัปเลเวล ใส่ไอเทม หรือปรับทีมแล้วท้าใหม่',w?`🍞 +${br} (รวมคืนค่าเข้า ${HBF})`:'',`⭐ EXP +${xp}`,L1>L0?`🎉 เลเวลอัป! Lv.${L0} → Lv.${L1}`:'',w&&own?'✔ ฮีโร่ตัวนี้มีไอเทมประจำตัวแล้ว':'',w&&!own&&!got?`🎲 ไม่ดรอป — รอบหน้าโอกาส ${Math.round(Math.min(1,.15+.12*(pt+1))*100)}%`:'',...dr.map(it=>`<span style="color:${TIER[it.t].c}">🌟 ${iNm(it)} [${TIER[it.t].n}] ${iTxt(it)}</span>`)].filter(Boolean).join('<br>');
end(w?`🏆 ล้มเงา${H[i].n}สำเร็จ!`:'💀 พ่ายแพ้',ln,[['🔁 ท้าอีกครั้ง',()=>hbStart(i)],['👹 หน้าบอส',()=>advGo('boss')],['🗺️ แผนที่',()=>advGo('map')]],statsHTML())}

home();
</script></body></html>
